name: Manual release
run-name: Release ${{ inputs.source_branch }} (${{ inputs.request_id }})
on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
concurrency:
  group: rawmark-release
  cancel-in-progress: false
jobs:
  release:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: docker
    timeout-minutes: 115
    container:
      image: node:24-bookworm
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ forgejo.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Install release tools
        run: |
          apt-get update
          apt-get install -y python3 skopeo git-lfs ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable' > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce-cli docker-buildx-plugin
          corepack enable
          corepack prepare pnpm@12.11.2 --activate
          node --version
          test "$(pnpm --version)" = '12.11.2'
          go version
          docker version
          skopeo --version
      - name: Build and publish fixed source
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_REF: ${{ forgejo.ref }}
          FORGEJO_API_URL: ${{ forgejo.server_url }}/api/v1
          FORGEJO_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CI_RUN_ID: ${{ forgejo.run_id }}
          CI_RUN_ATTEMPT: ${{ forgejo.run_attempt }}
          CI_RESOURCE_LABEL: io.rawmark.ci.run=release-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}
          DOCKER_CONFIG: /tmp/rawmark-release-auth
        run: |
          mkdir -m 700 -p "$DOCKER_CONFIG"
          python3 scripts/manual-release.py
      - name: Clean only this run
        if: always()
        run: |
          python3 scripts/ci-cleanup.py 'io.rawmark.ci.run=release-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}' --client-container "$(hostname)" --image 'rawmark-ci:release-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}'
          builder='rawmark-release-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}'
          if docker buildx inspect "$builder" >/dev/null 2>&1; then docker buildx rm "$builder"; fi
          if docker context inspect "$builder-context" >/dev/null 2>&1; then docker context rm "$builder-context"; fi
          rm -rf /tmp/rawmark-release-auth
