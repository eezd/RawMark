name: Manual release
run-name: Release ${{ inputs.source_branch }} (${{ inputs.request_id }})
on:
  workflow_dispatch:
    inputs:
      source_branch:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
concurrency:
  group: rawmark-release
  cancel-in-progress: false
jobs:
  release:
    if: gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    container:
      image: node:24-bookworm
      volumes:
        - /docker/gitea/mirrors/RawMark:/docker/gitea/mirrors/RawMark
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: source/go.mod
          cache: false
      - name: Install release tools
        run: |
          apt-get update
          apt-get install -y python3 skopeo git-lfs ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable' > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce-cli docker-buildx-plugin
          corepack enable
          corepack prepare pnpm@12.11.2 --activate
      - name: Build and publish fixed source once
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          GITEA_API_URL: ${{ gitea.server_url }}/api/v1
          GITEA_RELEASE_TOKEN: ${{ secrets.RAWMARK_GITEA_TOKEN }}
          GITHUB_RELEASE_TOKEN: ${{ secrets.ALL_GITHUB_TOKEN }}
          CI_RUN_ID: ${{ gitea.run_id }}
          CI_RESOURCE_LABEL: io.rawmark.ci.run=release-${{ gitea.run_id }}-${{ gitea.run_attempt }}
          DOCKER_CONFIG: /tmp/rawmark-release-auth
        run: |
          mkdir -m 700 -p "$DOCKER_CONFIG"
          python3 scripts/manual-release.py
      - name: Clean only this run
        if: always()
        run: |
          python3 scripts/ci-cleanup.py 'io.rawmark.ci.run=release-${{ gitea.run_id }}-${{ gitea.run_attempt }}' --client-container "$(hostname)"
          rm -rf /tmp/rawmark-release-auth
