# Copy this file to the instance directory; use a private .env beside it.
name: ${RAWMARK_PROJECT:?Set RAWMARK_PROJECT}
services:
  rawmark:
    container_name: ${RAWMARK_CONTAINER_NAME:?Set RAWMARK_CONTAINER_NAME}
    image: ${RAWMARK_IMAGE:?Set a verified registry image digest}
    ports:
      - "${RAWMARK_BIND:-127.0.0.1}:${RAWMARK_PORT:?Set RAWMARK_PORT}:8080"
    volumes:
      - type: bind
        source: ${RAWMARK_DATA_DIR:?Set the absolute persistent data directory}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 15s
