# raw.134333.xyz -> RawMark 容器（127.0.0.1:21000）

server {
  listen 80;
  server_name raw.134333.xyz;
  return 308 https://raw.134333.xyz$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name raw.134333.xyz;

  include /etc/nginx/snippets/ssl-134333.xyz.conf;
  include /etc/nginx/snippets/no-spider.conf;
  access_log /var/log/nginx/raw.134333.xyz.log;
  error_log /var/log/nginx/raw.134333.xyz.error.log warn;

  location / {
    proxy_pass http://127.0.0.1:21000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }
}
